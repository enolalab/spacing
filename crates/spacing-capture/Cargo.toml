[package]
name = "spacing-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
spacing-core = { path = "../spacing-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
spacing-ei = { path = "../spacing-ei" }
evdev = { version = "0.12", features = ["tokio"] }
futures = "0.3"
# remote_desktop requires screencast feature (ashpd 0.13 imports it unconditionally)
ashpd = { version = "0.13", features = ["input_capture", "remote_desktop", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
