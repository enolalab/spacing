[package]
name = "spacing-inject"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
spacing-core = { path = "../spacing-core" }
spacing-ei = { path = "../spacing-ei" }
evdev = "0.12"
tracing = "0.1"
async-trait = "0.1"
arboard = "3.4"
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
enumflags2 = "0.7"
