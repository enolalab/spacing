<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" font-family="DejaVu Sans Mono, monospace">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="1080" height="430" fill="#101115"/>

  <!-- server box -->
  <rect x="30" y="60" width="440" height="310" rx="12" fill="#18191f" stroke="#3f424c"/>
  <text x="250" y="92" fill="#e5e7eb" font-size="20" text-anchor="middle" font-weight="bold">spacing-srv · server (input owner)</text>

  <rect x="60" y="120" width="180" height="56" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="150" y="143" fill="#93c5fd" font-size="14" text-anchor="middle">physical kbd+mouse</text>
  <text x="150" y="163" fill="#6b7280" font-size="12" text-anchor="middle">/dev/input/event*</text>

  <rect x="270" y="120" width="170" height="56" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="355" y="143" fill="#93c5fd" font-size="14" text-anchor="middle">evdev capture</text>
  <text x="355" y="163" fill="#6b7280" font-size="12" text-anchor="middle">EVIOCGRAB</text>

  <rect x="270" y="206" width="170" height="56" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="355" y="229" fill="#93c5fd" font-size="14" text-anchor="middle">router</text>
  <text x="355" y="249" fill="#6b7280" font-size="12" text-anchor="middle">Local ⇄ Remote(hotkey)</text>

  <rect x="270" y="292" width="170" height="56" rx="8" fill="#14532d" stroke="#4ade80"/>
  <text x="355" y="315" fill="#86efac" font-size="14" text-anchor="middle">mTLS 1.3 + postcard</text>
  <text x="355" y="335" fill="#4ade80" font-size="12" text-anchor="middle">TCP :24800</text>

  <line x1="240" y1="148" x2="270" y2="148" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="355" y1="176" x2="355" y2="206" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="355" y1="262" x2="355" y2="292" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr)"/>

  <text x="150" y="240" fill="#6b7280" font-size="13">Ctrl+Alt+0 → local</text>
  <text x="150" y="260" fill="#6b7280" font-size="13">Ctrl+Alt+1 → client</text>
  <text x="150" y="290" fill="#6b7280" font-size="12">fail-safe: ungrab on</text>
  <text x="150" y="306" fill="#6b7280" font-size="12">client loss / errors</text>

  <!-- wire -->
  <line x1="440" y1="320" x2="610" y2="320" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="525" y="306" fill="#4ade80" font-size="13" text-anchor="middle">input events</text>
  <text x="525" y="342" fill="#6b7280" font-size="12" text-anchor="middle">fingerprint-pinned</text>

  <!-- client box -->
  <rect x="610" y="60" width="440" height="310" rx="12" fill="#18191f" stroke="#3f424c"/>
  <text x="830" y="92" fill="#e5e7eb" font-size="20" text-anchor="middle" font-weight="bold">spacing-cli · client (controlled)</text>

  <rect x="640" y="292" width="170" height="56" rx="8" fill="#14532d" stroke="#4ade80"/>
  <text x="725" y="315" fill="#86efac" font-size="14" text-anchor="middle">TLS + decode</text>
  <text x="725" y="335" fill="#4ade80" font-size="12" text-anchor="middle">500ms watchdog</text>

  <rect x="840" y="292" width="170" height="56" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="925" y="315" fill="#93c5fd" font-size="14" text-anchor="middle">uinput inject</text>
  <text x="925" y="335" fill="#6b7280" font-size="12" text-anchor="middle">/dev/uinput</text>

  <rect x="840" y="120" width="170" height="56" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="925" y="143" fill="#93c5fd" font-size="14" text-anchor="middle">spacing-virtual-input</text>
  <text x="925" y="163" fill="#6b7280" font-size="12" text-anchor="middle">OS sees real device</text>

  <line x1="810" y1="320" x2="840" y2="320" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="925" y1="292" x2="925" y2="176" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr)"/>

  <text x="652" y="240" fill="#6b7280" font-size="13">ReleaseControl →</text>
  <text x="652" y="258" fill="#6b7280" font-size="13">release_all() (no stuck keys)</text>
</svg>
